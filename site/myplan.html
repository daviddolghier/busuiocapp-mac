<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Busuioc App | MyPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <script src="theme-preload.js"></script><link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-shell">
    <div class="ambient ambient--one"></div><div class="ambient ambient--two"></div>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Acasă"><span class="brand__mark"><img src="images/logo.png" alt="Logo" /></span><span class="brand__text"><strong>Busuioc App</strong><small>MyPlan</small></span></a>
      <nav class="nav">
        <a href="#" id="theme-toggle" class="chip" role="button" aria-label="Comută tema">
          <i class="bi bi-moon-stars" id="theme-icon"></i>
        </a>
        <a class="chip" href="settings.html" aria-label="Setări"><i class="bi bi-gear"></i></a>
        <a class="chip" data-feature="recipes" href="recipes.html" aria-label="Rețete"><i class="bi bi-fork-knife"></i></a>
        <a href="index.html" class="nav__link"><i class="bi bi-house-heart-fill"></i> Home</a>
        <a href="galerie.html" class="nav__link"><i class="bi bi-camera-fill"></i> Galerie</a>
        <a href="aniversari.html" class="nav__link"><i class="bi bi-calendar2-week"></i> Aniversări</a>
        <a href="harta.html" class="nav__link"><i class="bi bi-map"></i> Hartă</a>
        <a href="myplan.html" class="nav__link is-active"><i class="bi bi-check2-square"></i> MyPlan</a>
      </nav>
    </header>
    <main class="page-main myplan-page">
      <section class="page-hero">
        <p class="eyebrow">Planurile voastre</p>
        <h1>MyPlan</h1>
        <p class="page-hero__text">Călătorii, evenimente, proiecte și idei personale — toate într-un loc pe care îl construiți împreună.</p>
        <button class="btn btn--primary" id="createPlan" type="button"><i class="bi bi-plus-lg"></i> Creează un plan nou</button>
      </section>
      <section class="section section--compact">
        <div class="plans-grid" id="plansGrid" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="plan-dialog" id="planDialog">
      <form class="plan-dialog__card" id="planForm" method="dialog">
        <div class="dialog-head"><div><p class="eyebrow" id="planDialogEyebrow">MyPlan</p><h2 id="planDialogTitle">Creează un plan nou</h2></div><button class="dialog-close" id="closePlanDialog" type="button" aria-label="Închide"><i class="bi bi-x-lg"></i></button></div>
        <div class="dialog-body plan-form">
          <label>Titlul planului<input id="planTitle" required maxlength="120" placeholder="De exemplu: Vacanța noastră" /></label>
          <label>Planifică<select id="planType"><option>Călătorie</option><option>Eveniment</option><option>Proiect</option><option>Aniversare</option><option>Personalizat</option></select></label>
          <label>Data evenimentului <span class="form-hint">(opțional)</span><input id="planDate" type="date" /></label>
          <label>Notițe<textarea id="planNotes" rows="5" maxlength="3000" placeholder="Idei, detalii și orice vreți să vă amintiți..."></textarea></label>
          <div class="plan-form__section"><div class="plan-form__section-head"><strong>Lista de făcut</strong><button class="chip chip--soft" id="addTask" type="button"><i class="bi bi-plus-lg"></i> Adaugă</button></div><div class="task-editor" id="taskEditor"></div></div>
          <div class="plan-form__section"><div class="plan-form__section-head"><strong>Fișiere atașate</strong><button class="chip chip--soft" id="importAttachment" type="button"><i class="bi bi-paperclip"></i> Importă fișier</button></div><div class="attachment-editor" id="attachmentEditor"></div></div>
        </div>
        <div class="dialog-actions"><button class="dialog-action" id="cancelPlan" type="button">Anulează</button><button class="dialog-action dialog-action--primary" type="submit">Salvează planul</button></div>
      </form>
    </dialog>
    <div class="toast" id="planToast"></div>
    <script src="shortcuts.js"></script><script src="myplan.js"></script><script src="theme.js"></script><script src="features.js"></script>
  </body>
</html>
