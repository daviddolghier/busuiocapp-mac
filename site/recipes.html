<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Busuioc App | Rețete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <script src="theme-preload.js"></script><link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-shell recipes-page">
    <div class="ambient ambient--one"></div><div class="ambient ambient--two"></div>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Acasă"><span class="brand__mark"><img src="images/logo.png" alt="Logo" /></span><span class="brand__text"><strong>Busuioc App</strong><small>Rețete</small></span></a>
      <nav class="nav">
        <a href="#" id="theme-toggle" class="chip" role="button" aria-label="Comută tema"><i class="bi bi-moon-stars" id="theme-icon"></i></a>
        <a class="chip" href="settings.html" aria-label="Setări"><i class="bi bi-gear"></i></a>
        <a class="chip is-active" data-feature="recipes" href="recipes.html" aria-label="Rețete"><i class="bi bi-fork-knife"></i></a>
        <a href="index.html" class="nav__link"><i class="bi bi-house-heart-fill"></i> Home</a><a href="galerie.html" class="nav__link"><i class="bi bi-camera-fill"></i> Galerie</a><a href="aniversari.html" class="nav__link"><i class="bi bi-calendar2-week"></i> Aniversări</a><a href="harta.html" class="nav__link"><i class="bi bi-map"></i> Hartă</a><a href="myplan.html" class="nav__link"><i class="bi bi-check2-square"></i> MyPlan</a>
      </nav>
    </header>
    <main class="page-main recipes-main">
      <section class="recipes-hero">
        <p class="eyebrow">Bucătăria noastră</p><h1>Rețete</h1><p>Locul în care păstrați gusturile preferate și ideile pe care vreți să le încercați împreună.</p>
      </section>
      <section class="recipes-toolbar" id="recipeSearchArea">
        <div class="recipe-tabs" role="tablist"><button class="recipe-tab is-active" data-category="main" type="button">Rețete principale</button><button class="recipe-tab" data-category="other" type="button">Sosuri, băuturi &amp; altele</button></div>
        <label class="recipe-search"><i class="bi bi-search"></i><input id="recipeSearch" type="search" placeholder="Caută după rețetă sau ingredient..." autocomplete="off" /></label>
      </section>
      <section class="recipes-grid" id="recipesGrid" aria-live="polite"></section>
    </main>
    <aside class="recipe-rail" aria-label="Acțiuni rețete">
      <div class="recipe-rail__pair"><button class="rail-btn" id="addRecipe" type="button" title="Adaugă o rețetă"><i class="bi bi-plus-lg"></i><span>Adaugă</span></button><button class="rail-btn" id="editRecipes" type="button" title="Editează rețetele"><i class="bi bi-pencil-square"></i><span>Editează</span></button></div>
      <button class="rail-btn rail-btn--wide" id="focusSearch" type="button"><i class="bi bi-search"></i><span>Caută</span></button>
      <button class="rail-btn rail-btn--wide layout-switch" id="toggleLayout" type="button"><i class="bi bi-grid-3x3-gap"></i><span>Aranjare portret</span></button>
    </aside>
    <dialog class="recipe-dialog" id="recipeDialog"><form class="recipe-dialog__card" id="recipeForm" method="dialog"><div class="dialog-head"><div><p class="eyebrow">Colecția voastră</p><h2 id="recipeDialogTitle">Adaugă o rețetă</h2></div><button class="dialog-close" id="closeRecipeDialog" type="button" aria-label="Închide"><i class="bi bi-x-lg"></i></button></div><div class="dialog-body recipe-form"><label>Numele rețetei<input id="recipeTitle" required maxlength="120" placeholder="De exemplu: Paste cremoase" /></label><label>Categoria<select id="recipeCategory"><option value="main">Rețete principale</option><option value="other">Altele</option></select></label><label>Ingrediente <span class="form-hint">(separate prin virgulă)</span><textarea id="recipeIngredients" required rows="3" maxlength="1200" placeholder="paste, parmezan, smântână... "></textarea></label><div class="recipe-form__two"><label>Timp estimat<input id="recipeTime" maxlength="60" placeholder="25 min" /></label><div class="recipe-image-picker"><span>Imagine</span><div><img id="recipeImagePreview" alt="Previzualizare imagine" hidden /><button class="chip chip--soft" id="importRecipeImage" type="button"><i class="bi bi-image"></i> Alege imagine</button><button class="icon-btn" id="clearRecipeImage" type="button" title="Elimină imaginea" hidden><i class="bi bi-x-lg"></i></button></div><small id="recipeImageName" class="form-hint">Opțional — alege direct din calculator.</small><input id="recipeImageFile" type="file" accept="image/*" hidden /></div></div><label>Pașii rețetei<textarea id="recipeSteps" rows="6" maxlength="5000" placeholder="1. Pregătește ingredientele... "></textarea></label></div><div class="dialog-actions"><button class="dialog-action" id="cancelRecipe" type="button">Anulează</button><button class="dialog-action dialog-action--primary" type="submit">Salvează rețeta</button></div></form></dialog>
    <div class="toast" id="recipeToast"></div>
    <script src="theme.js"></script><script src="features.js"></script><script src="shortcuts.js"></script><script src="recipes.js"></script>
  </body>
</html>
