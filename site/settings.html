<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busuioc App | Setări</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="styles.css">
  <style>
    .settings-dialog { position: fixed; inset: 0; height: fit-content; margin: auto; }
    .settings-page{position:relative;z-index:1;width:min(720px,calc(100% - 2rem));margin:auto;padding:2rem 0 4rem}.settings-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}.back-btn{display:inline-flex;gap:.5rem;align-items:center;padding:.65rem 1rem;border:1px solid var(--surface-border);border-radius:999px;color:var(--text);background:var(--surface);text-decoration:none}.settings-hero{display:flex;gap:1rem;align-items:center;margin-bottom:2.5rem}.settings-hero__icon{display:grid;place-items:center;width:3.5rem;height:3.5rem;border-radius:1rem;background:var(--accent-gradient);color:#fff;font-size:1.4rem}.settings-hero h1{font:600 2.6rem/1 var(--font-display)}.settings-hero p,.settings-card__text small{color:var(--muted)}.settings-section{margin-top:1.8rem}.settings-section h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 .65rem}.settings-list{display:grid;gap:.7rem}.settings-card{display:flex;align-items:center;gap:1rem;width:100%;padding:1rem 1.1rem;border:1px solid var(--surface-border);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow-soft);transition:.2s}.settings-card:hover{transform:translateY(-2px);border-color:var(--accent-light);background:var(--surface-strong)}.settings-card__icon{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.8rem;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent-light);font-size:1.1rem}.settings-card__text{display:grid;gap:.15rem;flex:1}.settings-card__text strong{font-size:.98rem}.settings-card>i{color:var(--muted)}.settings-card--danger .settings-card__icon{background:rgba(220,38,38,.12);color:#ef4444}.settings-dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(460px,calc(100% - 2rem))}.settings-dialog::backdrop{background:rgba(8,10,20,.65);backdrop-filter:blur(8px)}.dialog-card{background:var(--surface-strong);border:1px solid var(--surface-border);border-radius:var(--radius-xl);box-shadow:var(--shadow);overflow:hidden}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;border-bottom:1px solid var(--surface-border)}.dialog-head h2{font:600 1.7rem var(--font-display)}.dialog-close{border:0;background:transparent;color:var(--text);font-size:1.15rem;cursor:pointer}.dialog-body{padding:1.25rem}.dialog-body p{color:var(--muted);line-height:1.6}.dialog-options{display:grid;gap:.6rem;margin-top:1rem}.dialog-option{display:flex;align-items:center;gap:.75rem;width:100%;padding:.9rem;border:1px solid var(--surface-border);border-radius:var(--radius-md);background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}.dialog-option:hover{border-color:var(--accent-light);background:color-mix(in srgb,var(--accent) 9%,transparent)}.dialog-option .check{margin-left:auto;color:var(--accent-light)}.dialog-actions{display:flex;justify-content:flex-end;gap:.65rem;padding:1rem 1.25rem;border-top:1px solid var(--surface-border)}.dialog-action{padding:.7rem 1rem;border:1px solid var(--surface-border);border-radius:var(--radius-md);background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer}.dialog-action--primary{border:0;background:var(--accent-gradient);color:#fff}.dialog-action--danger{background:#dc2626;color:#fff;border:0}.toast{position:fixed;z-index:10;bottom:2rem;left:50%;transform:translate(-50%,100px);opacity:0;padding:.8rem 1.1rem;border-radius:999px;background:var(--surface-strong);border:1px solid var(--surface-border);box-shadow:var(--shadow);transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
  </style>
</head>
<body class="page-shell"><div class="ambient ambient--one"></div><div class="ambient ambient--two"></div>
  <main class="settings-page"><div class="settings-top"><a class="back-btn" href="index.html"><i class="bi bi-arrow-left"></i> Înapoi acasă</a><a href="#" id="theme-toggle" class="back-btn" aria-label="Comută aspectul"><i class="bi bi-circle-half" id="theme-icon"></i></a></div>
    <section class="settings-hero"><div class="settings-hero__icon"><i class="bi bi-gear-fill"></i></div><div><h1>Setări</h1></div></section>
    <section class="settings-section"><h2>Aspect</h2><div class="settings-list"><button class="settings-card" id="palette-settings"><span class="settings-card__icon"><i class="bi bi-palette-fill"></i></span><span class="settings-card__text"><strong>Temă de culoare</strong><small>Violet, roșiatic, alb simplu sau roz</small></span><i class="bi bi-chevron-right"></i></button><button class="settings-card" id="appearance-settings"><span class="settings-card__icon"><i class="bi bi-circle-half"></i></span><span class="settings-card__text"><strong>Aspect</strong><small>Deschis, întunecat sau automat</small></span><i class="bi bi-chevron-right"></i></button></div></section>
    <section class="settings-section"><h2>Date și backup</h2><div class="settings-list"><button class="settings-card" id="create-backup"><span class="settings-card__icon"><i class="bi bi-box-seam"></i></span><span class="settings-card__text"><strong>Creează backup</strong><small>Fotografii, videoclipuri, ordine și setări într-un ZIP</small></span><i class="bi bi-chevron-right"></i></button><button class="settings-card" id="import-backup"><span class="settings-card__icon"><i class="bi bi-box-arrow-in-down"></i></span><span class="settings-card__text"><strong>Importă backup</strong><small>Rescrie tot sau combină cu datele actuale</small></span><i class="bi bi-chevron-right"></i></button></div></section>
    <section class="settings-section"><h2>Sistem</h2><div class="settings-list"><button class="settings-card settings-card--danger" id="reset-all"><span class="settings-card__icon"><i class="bi bi-exclamation-octagon-fill"></i></span><span class="settings-card__text"><strong>Resetează tot</strong><small>Șterge setări, fotografii, videoclipuri și ordinea lor</small></span><i class="bi bi-chevron-right"></i></button></div></section>
  </main>
  <dialog class="settings-dialog" id="settings-dialog"><div class="dialog-card"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="dialog-close" id="dialog-close" aria-label="Închide"><i class="bi bi-x-lg"></i></button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></div></dialog><div class="toast" id="toast"></div>
  <script src="theme.js"></script><script src="settings.js"></script>
</body></html>
