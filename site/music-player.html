<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Busuioc App | Music Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <script src="theme-preload.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-width:500px; min-height:500px; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font-body,Arial,sans-serif); }
    #visualizer { position:fixed; inset:0; width:100%; height:100%; opacity:.85; }
    .player { position:relative; z-index:1; height:100vh; display:grid; grid-template-rows:auto 1fr auto; padding:1rem; }
    .player__top { display:flex; align-items:center; justify-content:space-between; }
    .home-link,.choose-button { border:1px solid var(--surface-border); border-radius:999px; background:var(--surface); color:var(--text); font:700 .78rem var(--font-body,Arial,sans-serif); cursor:pointer; text-decoration:none; }
    .home-link { display:inline-flex; gap:.4rem; align-items:center; padding:.55rem .75rem; }
    .choose-button { padding:.6rem .8rem; }
    .player__art { align-self:center; justify-self:center; display:grid; place-items:center; width:176px; height:176px; border:2px solid white; border-radius:50%; overflow:hidden; box-shadow:0 0 40px white; background:var(--surface-strong); }
    .player__art img { align-self: center; justify-self: center; width:100%; height:100%; object-fit:cover; }
    .controls { display:grid; gap:.9rem; width:100%; text-align:center; }
    #title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.9rem; color:var(--muted); }
    #progress { width:100%; accent-color:var(--accent); cursor:pointer; }
    #play { justify-self:center; display:grid; place-items:center; width:54px; height:54px; border:0; border-radius:50%; color:#fff; background:var(--accent-gradient); font-size:1.25rem; cursor:pointer; box-shadow:var(--shadow-soft); }
    #play:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <main class="player">
    <div class="player__top">
      <a class="home-link" href="index.html"><i class="bi bi-arrow-left"></i> Acasă</a>
      <button class="choose-button" id="chooseMusic" type="button"><i class="bi bi-folder2-open"></i> Alege muzica</button>
    </div>
    <div class="player__art"><img src="images/logo.png" alt="Busuioc App" /></div>
    <div class="controls">
      <div id="title">Alege o piesă pentru redare</div>
      <input id="progress" type="range" min="0" max="100" value="0" aria-label="Progresul piesei" />
      <button id="play" type="button" aria-label="Redă" disabled><i class="bi bi-play-fill"></i></button>
    </div>
  </main>
  <audio id="audio"></audio>
  <script src="theme.js"></script><script src="features.js"></script><script src="music-player.js"></script>
</body>
</html>
